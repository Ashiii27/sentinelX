# SentinelX — nginx reverse proxy
#
# Serves the built dashboard (SPA) and proxies API + WebSocket traffic
# to the local backend. Used two ways:
#
#   1. Host deployment (systemd): copied verbatim by install.sh; the
#      backend listens on 127.0.0.1:4000 on the same host.
#   2. Docker (dashboard image): the Dockerfile rewrites the upstream
#      address to the compose service name `backend:4000`.
#
# /api  → backend REST API
# /ws   → backend WebSocket live stream (Upgrade headers required)
# /     → dashboard static build (history-API fallback for /alerts etc.)

upstream sentinelx_backend {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Dashboard build output. Host deployment: /opt/sentinelx/...
    # Docker: the image installs the build into this same path.
    root /opt/sentinelx/dashboard/dist;
    index index.html;

    access_log /var/log/nginx/sentinelx.access.log;
    error_log  /var/log/nginx/sentinelx.error.log;

    client_max_body_size 1m;   # matches the backend's JSON limit

    # ── REST API ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://sentinelx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket live stream ───────────────────────────────────────────
    location /ws {
        proxy_pass http://sentinelx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep live sessions open
        proxy_send_timeout 3600s;
    }

    # ── Dashboard static files ──────────────────────────────────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA history-mode fallback
        try_files $uri $uri/ /index.html;
    }
}
